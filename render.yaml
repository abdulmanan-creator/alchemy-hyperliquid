# =============================================================================
# Render deploy config — two services in one repo (monorepo).
# Push to GitHub, point Render at this file, set the env vars, deploy.
# =============================================================================

services:
  # ---- API ------------------------------------------------------------------
  - type: web
    name: alchemy-hl-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm ci && npm run build -w @alchemy-hl/shared && npm run build -w @alchemy-hl/api
    startCommand: npm run start -w @alchemy-hl/api
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: ALCHEMY_BUILDER_ADDRESS
        sync: false
      - key: HYPERLIQUID_API_URL
        value: https://api.hyperliquid.xyz
      - key: PERPS_BUILDER_FEE_BPS
        value: 4
      - key: SPOT_BUILDER_FEE_BPS
        value: 5
      - key: MAX_BUILDER_FEE_BPS_PERPS
        value: 10
      - key: MAX_BUILDER_FEE_BPS_SPOT
        value: 100
      - key: WEB_ORIGIN
        fromService:
          name: alchemy-hl-web
          type: web
          property: hostport
      - key: LOG_LEVEL
        value: info
      # Privy verification for /agent/exchange. Both PRIVY_APP_ID (public)
      # and PRIVY_APP_SECRET (secret) required; absence disables agent path.
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      # Master seed for deterministic per-user agent key derivation.
      # Generate once: openssl rand -hex 32. Treat as secret.
      - key: AGENT_MASTER_SEED
        sync: false
      # Hard server-side cap on leverage via the agent path. Users can set
      # higher via /exchange with their primary wallet signature.
      - key: MAX_AGENT_LEVERAGE_PERPS
        value: 10
      # HS256 secret for the OAuth access tokens our MCP server issues to
      # Claude Web / ChatGPT. Shared across api + mcp + web. 32 bytes hex.
      - key: OAUTH_SIGNING_SECRET
        sync: false

  # ---- Web ------------------------------------------------------------------
  - type: web
    name: alchemy-hl-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm ci && npm run build -w @alchemy-hl/shared && npm run build -w @alchemy-hl/sdk-preview && npm run build -w @alchemy-hl/web
    startCommand: npm run start -w @alchemy-hl/web
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: alchemy-hl-api
          type: web
          property: hostport
      - key: NEXT_PUBLIC_BUILDER_ADDR
        sync: false
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      # OAuth signing secret (server-side for /oauth/authorize → /oauth/issue-code).
      # Must match the same value on alchemy-hl-api and alchemy-hl-mcp.
      - key: OAUTH_SIGNING_SECRET
        sync: false

  # ---- MCP server (HTTP transport, for Claude Web + ChatGPT Apps) -----------
  # Phase 1 (Track A): ALCHEMY_HL_TRADE_KEY in env → hot-key signing, single
  #   user, no OAuth. Useful for: internal testing, ops-controlled demos.
  # Phase 2 (Track B): remove ALCHEMY_HL_TRADE_KEY, add OAuth broker on the
  #   API side, per-request Authorization header → multi-tenant. No changes to
  #   this service spec for the upgrade — same image, different env.
  - type: web
    name: alchemy-hl-mcp
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm ci && npm run build -w @alchemy-hl/shared && npm run build -w @alchemy-hl/sdk && npm run build -w @alchemy-hl/mcp-server
    startCommand: npm run start -w @alchemy-hl/mcp-server
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_TRANSPORT
        value: http
      # PORT is injected by Render and the mcp-server picks it up automatically.
      # Same backend as the API service — wired automatically.
      - key: ALCHEMY_HL_API_URL
        fromService:
          name: alchemy-hl-api
          type: web
          property: hostport
      # Phase 1 hot key (optional, used as fallback when no Authorization
      # header is present). Path B (OAuth) is now active alongside it.
      - key: ALCHEMY_HL_TRADE_KEY
        sync: false
      # OAuth signing secret (Path B). Shared across api + mcp + web.
      - key: OAUTH_SIGNING_SECRET
        sync: false
      # Public URLs for OAuth metadata + redirect targets.
      - key: MCP_PUBLIC_URL
        fromService:
          name: alchemy-hl-mcp
          type: web
          property: hostport
      - key: WEB_PUBLIC_URL
        fromService:
          name: alchemy-hl-web
          type: web
          property: hostport
      - key: LOG_LEVEL
        value: info
